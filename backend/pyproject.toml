[project]
name = "compsoc-challenge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",          # local development and tests only
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "websockets>=12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
