# Judge0 CE 1.13.1 settings used by CompSoc Challenge. Anything not listed keeps Judge0's
# default. CHANGE every "change-me" (and put the same AUTHN_TOKEN in .env as JUDGE0_AUTH_TOKEN).

# --- auth: the backend sends X-Auth-Token
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=change-me-judge0-token

# --- features we don't need, switched off
ENABLE_WAIT_RESULT=false
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false

# --- sandbox limits (the backend asks for 2 s CPU / 128 MB per hidden test, 5 s for benchmarks)
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=20
MAX_MAX_PROCESSES_AND_OR_THREADS=40
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=2048
NUMBER_OF_RUNS=1
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# --- batches (the backend sends up to 20 per request)
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
MAX_QUEUE_SIZE=200

# --- parallel sandboxes (a 2 vCPU / 4 GB host copes with 4)
COUNT=4

# --- Judge0's own database and cache (internal network only)
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=change-me-redis
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-judge0-db
